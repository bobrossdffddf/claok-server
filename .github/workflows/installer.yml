name: Cloak Installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # The app itself, built once. Both installers carry a copy of it, and it can
  # only be built on macOS, so the Windows job takes this one rather than going
  # without. Shipping a setup program with no app inside it is the whole reason
  # this job exists.
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Bridge/cloak-bridge

      - name: Tools
        run: brew install xcodegen

      - name: Build Cloak.ipa
        run: bash Scripts/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Cloak-ipa
          path: Desktop/payload/Cloak.ipa
          retention-days: 1

  windows:
    needs: app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Cloak-ipa
          path: Desktop/payload

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop

      - name: Read the version
        id: version
        shell: bash
        run: |
          . Scripts/version.sh
          echo "version=$CLOAK_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$CLOAK_BUILD" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: Desktop
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src
        run: cargo build --release

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/CloakInstaller | Out-Null
          Copy-Item Desktop/target/release/cloak-installer.exe dist/CloakInstaller/CloakInstaller.exe
          Copy-Item Desktop/payload/Cloak.ipa dist/CloakInstaller/Cloak.ipa
          Copy-Item Desktop/README.md dist/CloakInstaller/README.txt
          Compress-Archive -Path dist/CloakInstaller/* -DestinationPath dist/CloakInstaller-windows.zip

      - name: Build the setup program
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            "/DCLOAK_VERSION=${{ steps.version.outputs.version }}" `
            "/DCLOAK_BUILD=${{ steps.version.outputs.build }}" `
            Desktop\installer.nsi

      - name: Check the app went in
        shell: pwsh
        run: |
          if (-not (Test-Path dist/CloakInstaller-Setup.exe)) { throw "no setup program was produced" }
          $size = (Get-Item dist/CloakInstaller-Setup.exe).Length
          Write-Host "setup is $([math]::Round($size/1MB,1)) MB"
          if ($size -lt 5MB) { throw "the setup program is too small to contain Cloak.ipa" }

      - uses: actions/upload-artifact@v4
        with:
          name: CloakInstaller-windows
          path: |
            dist/CloakInstaller-Setup.exe
            dist/CloakInstaller-windows.zip

  linux:
    needs: app
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Cloak-ipa
          path: Desktop/payload

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop

      # usbmuxd is bundled so a Chromebook Linux container without it still
      # works. libusb is its only runtime dependency.
      - name: usbmuxd to bundle
        run: sudo apt-get update && sudo apt-get install -y usbmuxd

      - name: Build the portable installer
        env:
          CLOAK_LINUX_TARGET: ${{ matrix.target }}
        run: bash Scripts/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CloakInstaller-linux-${{ matrix.arch }}
          path: dist/CloakInstaller-linux-${{ matrix.arch }}.tar.gz

  macos:
    needs: app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Cloak-ipa
          path: Desktop/payload

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop

      # The same scripts used to build locally, so CI cannot quietly drift into
      # producing something different from what gets tested by hand.
      - name: Package
        run: |
          bash Scripts/build-installer.sh
          bash Scripts/build-dmg.sh
          cd dist && zip -qry CloakInstaller-macos.zip "Cloak Installer.app"

      - uses: actions/upload-artifact@v4
        with:
          name: CloakInstaller-macos
          path: |
            dist/CloakInstaller-macos.dmg
            dist/CloakInstaller-macos.zip
