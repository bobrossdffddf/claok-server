[package]
name = "cloak-installer"
version = "1.7.1"
edition = "2021"
description = "Puts Cloak on your iPhone and keeps it there."

[[bin]]
name = "cloak-installer"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]
cli = []

[dependencies]
eframe = { version = "0.31", optional = true }
egui = { version = "0.31", optional = true }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "process"] }
idevice = { version = "0.1.65", features = [
    "usbmuxd", "amfi", "installation_proxy", "afc", "misagent", "heartbeat", "house_arrest", "ring",
    "remote_pairing",
    # The door Xcode uses on iOS 17 and later. The doctor reports whether it
    # opens when lockdown's own port does not, which is the one measurement
    # that tells a broken cable apart from a phone refusing the old route.
    "core_device_proxy",
    # Reaching the phone over the cable's own network link, which is the only
    # route left when the driver refuses to proxy.
    "tcp",
    # Remote Service Discovery: the only door iOS 26.4 and later leaves open to
    # anything that is not Apple's own software.
    "rsd",
    "xpc",
    "tunnel_tcp_stack",
] }
# Finding the phone's remote pairing service on the local network, the way
# Xcode does. Pure Rust, so it builds for Windows too.
mdns-sd = "0.11"
base64 = "0.22"
libc = "0.2"
isideload = { version = "0.3", default-features = false, features = ["install", "tokio-mt", "fs-storage"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
# isideload's storage trait returns this error type, so implementing it needs the crate.
rootcause = "0.12"
# The anisette provider is a trait, so overriding one field of it means
# implementing it, and it is an async trait.
async-trait = "0.1"

# Same feature set isideload builds reqwest with, so this reuses that copy
# rather than compiling a second one with a different TLS backend.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "charset"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
# Same version isideload builds, so the pairing record can be dropped into the
# ipa before signing rather than pushed over AFC afterwards.
zip = { version = "8", default-features = false, features = ["deflate"] }
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
open = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true


[patch.crates-io]
isideload = { path = "vendor/isideload" }
