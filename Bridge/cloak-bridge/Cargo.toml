[package]
name = "cloak-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "cloak_bridge"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "cloak-pair-cli"
path = "src/bin/pair_cli.rs"

[[bin]]
name = "rpprobe"
path = "src/bin/rpprobe.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[dependencies]
idevice = { version = "0.1.65", features = [
    "tcp",
    "core_device_proxy",
    "tunnel_tcp_stack",
    "xpc",
    "rsd",
    "dvt",
    "location_simulation",
    "mobile_image_mounter",
    "tss",
    "usbmuxd",
    "pair",
    "remote_pairing",
    "afc",
    "installation_proxy",
] }
# The same signing library the desktop installer uses. It builds for
# aarch64-apple-ios, which is what makes renewing on the phone possible at all.
# keyring-storage is left off deliberately: it wants an entitlement a free
# signature cannot carry, and the state goes in the app container instead.
isideload = { version = "0.3.17", default-features = false, features = ["install", "tokio-mt"] }
rootcause = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
plist = "1"
serde_json = "1"
